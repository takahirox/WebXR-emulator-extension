<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Simulated bounded-floor outline</title>
<style>body {font: 18px sans-serif; background: #222; color: white} button {font: inherit; padding: 12px}</style>
<h1>Simulated virtual play area</h1>
<p>Developer testing only. This outline is not a real guardian/chaperone safety limit.</p>
<p>Select the matching profile/mode in WebXR DevTools. Move the headset (Quest) or left controller/tablet (Android) to view the floor outline.</p>
<button data-mode="immersive-vr">Start Quest VR</button>
<button data-mode="immersive-ar">Start Quest MR / Android AR</button>
<button id="end">End session</button>
<pre id="status"></pre>
<script type="module">
import {startBoundedFloor} from './bounded-floor.js';
let demo;
const status = document.getElementById('status');
for (const button of document.querySelectorAll('[data-mode]')) button.onclick = async () => {
  try {
    demo = await startBoundedFloor(button.dataset.mode);
    status.textContent = JSON.stringify(demo.reference.boundsGeometry, null, 2);
  } catch (error) { status.textContent = String(error); }
};
document.getElementById('end').onclick = () => demo?.session.end();
</script>
</html>
